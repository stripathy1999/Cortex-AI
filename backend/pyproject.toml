[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "pycryptodome>=3.19.0",
    "stagehand>=3.0.0",
    "flask>=3.1.2",
    "flask-socketio>=5.3.0",
    "flask-cors>=4.0.0",
    "requests>=2.32.5",
    "openai>=1.0.0",
    "python-dotenv>=1.0.1",
    "fish-audio-sdk>=1.0.0",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "python-socketio[client]>=5.11.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.0",
    "mss>=9.0.0",
    "twilio>=9.10.1",
    "discord-py>=2.6.4",
    "slack-bolt>=1.27.0",
]

[project.optional-dependencies]
vision = [
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.8.0",
]
# For Windows message bridge
discord = [
    "discord.py>=2.0.0",
]
slack = [
    "slack-bolt>=1.18.0",
]
whatsapp = [
    "twilio>=9.0.0",
]
